name: Release

# Publishes a GitHub Release for every version tag. The release notes are extracted
# from CHANGELOG.md so release and changelog stay in sync.
on:
  push:
    tags: ["v*.*.*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release notes from changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$(cat VERSION)" ]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION file ($(cat VERSION))." >&2
            exit 1
          fi

          # Extract everything between current version heading and next version.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { flag = 1; next }
            index($0, "## [") == 1 { flag = 0 }
            index($0, "]: http") > 0 { flag = 0 }
            flag { print }
          ' CHANGELOG.md > notes.md

          if [ ! -s notes.md ]; then
            echo "No changelog section found for $version." >&2
            exit 1
          fi

          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          # Ohne Interpolation in die Datei anhaengen: der Changelog enthaelt
          # Backticks, die die Shell sonst als Kommando ausfuehren wuerde.
          cat >> notes.md <<EOF
          ## Installation

          \`\`\`bash
          docker run -d --name scandeck -p 8080:8080 \\
            -v ./data:/data -v ./scans:/scans \\
            --restart unless-stopped \\
            ghcr.io/${owner}/scandeck:${version}
          \`\`\`

          Alternatively using [docker-compose.yaml](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docker-compose.yaml) from the repository.

          **Image:** \`ghcr.io/${owner}/scandeck:${version}\` — built for linux/amd64 and linux/arm64.

          **Initial setup:** After starting, open \`http://<host>:8080\`; the wizard guides you through scanner, Paperless-ngx, format and automation settings.
          EOF

          cat notes.md

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "ScanDeck $version" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" --title "ScanDeck $version" --notes-file notes.md
          fi
